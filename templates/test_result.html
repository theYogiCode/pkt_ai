<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Test Result - PKT AI</title>

    <!-- Use the existing common PKT AI stylesheet -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


    <!-- =========================================================
         TOP NAVIGATION
         ========================================================= -->
    <header class="topbar">

        <div class="logo">

            <div class="logo-badge">
                PK
            </div>

            <span>
                PKT AI
            </span>

        </div>


        <div class="topbar-right">

            <span class="user-name">
                Employee Assessment
            </span>

        </div>

    </header>



    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->
    <main class="main-content">


        <!-- =====================================================
             PAGE HEADER
             ===================================================== -->
        <div class="page-header">

            <div>

                <h1 class="page-title">
                    Test Completed
                </h1>

                <p class="page-subtitle">
                    Your assessment has been successfully submitted.
                </p>

            </div>

        </div>



        <!-- =====================================================
             RESULT SUMMARY
             ===================================================== -->
        <div class="card">

            <h2 class="card-title">
                {{ test.test_name }}
            </h2>


            <!-- Score -->
            <div class="stats-grid">

                <div class="stat-card">

                    <div class="stat-label">
                        Score
                    </div>

                    <div class="stat-value">
                        {{ score }} / {{ maximum_score }}
                    </div>

                </div>


                <!-- Percentage -->
                <div class="stat-card">

                    <div class="stat-label">
                        Percentage
                    </div>

                    <div class="stat-value">
                        {{ "%.2f"|format(percentage) }}%
                    </div>

                </div>

            </div>

        </div>



        <!-- =====================================================
             COMPLETION MESSAGE
             ===================================================== -->
        <div class="alert alert-success">

            Your test has been successfully submitted.

        </div>


    </main>



    <!-- =========================================================
         FOOTER
         ========================================================= -->
    <footer class="footer">

        <p>
            PKT AI &copy; 2026
        </p>

    </footer>


</body>

</html>
