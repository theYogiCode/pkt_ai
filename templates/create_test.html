<!DOCTYPE html>
<html>

<head>
    <title>Create Test</title>
</head>

<body>

<h2>Create New Test</h2>

<form method="POST">

<label>Test Name</label>

<br>

<input
type="text"
name="test_name"
required>

<br><br>

<label>Description</label>

<br>

<textarea
name="description"></textarea>

<br><br>

<label>Duration (Minutes)</label>

<br>

<input
type="number"
name="duration"
required>

<br><br>

<button type="submit">

Create Test

</button>

</form>

</body>

</html>
