<!DOCTYPE html>
<html>

<head>
    <title>Add Question</title>
</head>

<body>

    <!-- Display the title of the page -->
    <h2>Add Question</h2>

    <!-- Display which test this question belongs to -->
    <h3>Test: {{ test.test_name }}</h3>

    <hr>

    <!--
        This form sends the entered information to the same Flask route
        using the POST method.
    -->
    <form method="POST">

        <!-- Question text -->
        <label>Question:</label>
        <br>

        <textarea
            name="question_text"
            rows="6"
            cols="80"
            required></textarea>

        <br><br>


        <!-- Option A -->
        <label>Option A:</label>
        <br>

        <input
            type="text"
            name="option_a"
            size="80"
            required>

        <br><br>


        <!-- Option B -->
        <label>Option B:</label>
        <br>

        <input
            type="text"
            name="option_b"
            size="80"
            required>

        <br><br>


        <!-- Option C -->
        <label>Option C:</label>
        <br>

        <input
            type="text"
            name="option_c"
            size="80"
            required>

        <br><br>


        <!-- Option D -->
        <label>Option D:</label>
        <br>

        <input
            type="text"
            name="option_d"
            size="80"
            required>

        <br><br>


        <!-- Correct answer -->
        <label>Correct Answer:</label>
        <br>

        <select name="correct_answer" required>

            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>

        </select>

        <br><br>


        <!-- Marks -->
        <label>Marks:</label>
        <br>

        <input
            type="number"
            name="marks"
            value="1"
            min="1"
            required>

        <br><br>


        <!-- Submit button -->
        <button type="submit">
            Save Question
        </button>

    </form>

    <br>

    <!-- Return to question management -->
    <a href="{{ url_for('test.manage_questions', test_id=test.id) }}">
        <button type="button">
            Cancel
        </button>
    </a>

</body>

</html>
