<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Question - PKT AI</title>

    <!-- Use the existing common PKT AI stylesheet -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <!-- Page-specific sizing for question form -->
    <style>

        /* Keep the question form professional and readable */
        .question-form {
            max-width: 900px;
        }

        /* Question text area */
        .question-textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
        }

        /* Option fields */
        .option-input {
            width: 100%;
            max-width: 750px;
        }

        /* Smaller fields */
        .small-input {
            max-width: 180px;
        }

        /* Form buttons */
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

    </style>

</head>


<body>


    <!-- =========================================================
         TOP NAVIGATION
         ========================================================= -->
    <header class="topbar">

        <div class="logo">

            <div class="logo-badge">
                PK
            </div>

            <span>
                PKT AI
            </span>

        </div>


        <div class="topbar-right">

            <span class="user-name">
                Test Management
            </span>

        </div>

    </header>



    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->
    <main class="main-content">


        <!-- =====================================================
             PAGE HEADER
             ===================================================== -->
        <div class="page-header">

            <div>

                <h1 class="page-title">
                    Add Question
                </h1>

                <p class="page-subtitle">
                    Add a question and configure its answer options.
                </p>

            </div>

        </div>



        <!-- =====================================================
             TEST INFORMATION
             ===================================================== -->
        <div class="card">

            <h2 class="card-title">
                Test
            </h2>

            <p>
                <strong>
                    {{ test.test_name }}
                </strong>
            </p>

        </div>



        <!-- =====================================================
             QUESTION FORM
             ===================================================== -->
        <div class="card question-form">

            <h2 class="card-title">
                Question Details
            </h2>


            <!--
                This form sends the entered information
                to the same Flask route using POST.
            -->
            <form method="POST">


                <!-- =================================================
                     QUESTION
                     ================================================= -->
                <div class="form-group">

                    <label for="question_text">
                        Question
                    </label>

                    <textarea
                        id="question_text"
                        name="question_text"
                        class="form-control question-textarea"
                        placeholder="Enter the question"
                        required></textarea>

                </div>



                <!-- =================================================
                     OPTION A
                     ================================================= -->
                <div class="form-group">

                    <label for="option_a">
                        Option A
                    </label>

                    <input
                        type="text"
                        id="option_a"
                        name="option_a"
                        class="form-control option-input"
                        placeholder="Enter option A"
                        required>

                </div>



                <!-- =================================================
                     OPTION B
                     ================================================= -->
                <div class="form-group">

                    <label for="option_b">
                        Option B
                    </label>

                    <input
                        type="text"
                        id="option_b"
                        name="option_b"
                        class="form-control option-input"
                        placeholder="Enter option B"
                        required>

                </div>



                <!-- =================================================
                     OPTION C
                     ================================================= -->
                <div class="form-group">

                    <label for="option_c">
                        Option C
                    </label>

                    <input
                        type="text"
                        id="option_c"
                        name="option_c"
                        class="form-control option-input"
                        placeholder="Enter option C"
                        required>

                </div>



                <!-- =================================================
                     OPTION D
                     ================================================= -->
                <div class="form-group">

                    <label for="option_d">
                        Option D
                    </label>

                    <input
                        type="text"
                        id="option_d"
                        name="option_d"
                        class="form-control option-input"
                        placeholder="Enter option D"
                        required>

                </div>



                <!-- =================================================
                     CORRECT ANSWER
                     ================================================= -->
                <div class="form-group">

                    <label for="correct_answer">
                        Correct Answer
                    </label>

                    <select
                        id="correct_answer"
                        name="correct_answer"
                        class="form-control small-input"
                        required>

                        <option value="A">
                            A
                        </option>

                        <option value="B">
                            B
                        </option>

                        <option value="C">
                            C
                        </option>

                        <option value="D">
                            D
                        </option>

                    </select>

                </div>



                <!-- =================================================
                     MARKS
                     ================================================= -->
                <div class="form-group">

                    <label for="marks">
                        Marks
                    </label>

                    <input
                        type="number"
                        id="marks"
                        name="marks"
                        class="form-control small-input"
                        value="1"
                        min="1"
                        required>

                </div>



                <!-- =================================================
                     FORM ACTIONS
                     ================================================= -->
                <div class="form-actions">

                    <!-- Save question -->
                    <button
                        type="submit"
                        class="btn btn-primary">

                        Save Question

                    </button>


                    <!-- Cancel -->
                    <a
                        href="{{ url_for('test.manage_questions', test_id=test.id) }}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </div>


            </form>

        </div>


    </main>



    <!-- =========================================================
         FOOTER
         ========================================================= -->
    <footer class="footer">

        <p>
            PKT AI &copy; 2026
        </p>

    </footer>


</body>

</html>
